#file: noinspection UndefinedAction,UndefinedParamsPresent
name: publish

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    permissions:
      contents: write
      packages: write
    strategy:
      matrix:
        java: [ 17 ]
        os: [ ubuntu-22.04 ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          wget https://github.com/North-Western-Development/sedna-mc/releases/download/1.20.1-forge%2F1.0.50/sedna-1.20.1-forge-1.0.50+5c54a97.jar -O libs/sedna.jar
          ./gradlew -Psemver='${{ github.event.release.tag_name }}' build

      - name: Add Artifacts to Github Release
        uses: alexellis/upload-assets@0.4.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          asset_paths: '["./build/libs/*-all.jar"]'

      - name: Set release type to 'release'
        run: |
          echo "RELEASE_TYPE=release" >> $GITHUB_ENV
        if: github.event.release.prerelease == false
      - name: Set release type to 'alpha'
        run: |
          echo "RELEASE_TYPE=alpha" >> $GITHUB_ENV
        if: github.event.release.prerelease == true

      - name: Publish to Curseforge
        run: ./gradlew -Psemver='${{ github.event.release.tag_name }}' curseforge
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          RELEASE_TYPE: ${{ env.RELEASE_TYPE }}
          CHANGELOG: ${{ github.event.release.body }}

      - name: Publish to Modrinth
        run: ./gradlew -Psemver='${{ github.event.release.tag_name }}' modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          RELEASE_TYPE: ${{ env.RELEASE_TYPE }}
          CHANGELOG: ${{ github.event.release.body }}
