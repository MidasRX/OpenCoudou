#file: noinspection UndefinedAction,UndefinedParamsPresent
name: build

on:
  workflow_dispatch:
  push:
    branches: [ '1.20.1' ]

jobs:
  build:
    strategy:
      matrix:
        java: [ 17 ]
        os: [ ubuntu-22.04 ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          wget https://github.com/North-Western-Development/sedna-mc/releases/download/1.20.1-forge%2F1.0.50/sedna-1.20.1-forge-1.0.50+5c54a97.jar -O libs/sedna.jar
          ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: oc2r.jar
          path: build/libs/*-all.jar
